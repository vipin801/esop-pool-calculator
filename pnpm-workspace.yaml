# pnpm settings. In pnpm 10+ these live here rather than in package.json.
#
# Which dependencies may run an install script, decided explicitly rather than
# left as a warning every install repeats. A new dependency that wants one has
# to be added here on purpose, in a diff, instead of being trusted silently.
allowBuilds:
  # Places its platform-native binary on install. Vitest does not run without it.
  esbuild: true
  # Transitive dependency of jspdf. Its postinstall prints a funding notice and
  # builds nothing, so it has no reason to execute.
  core-js: false
  # Transitive dependency of eslint-import-resolver-typescript (itself pulled
  # in by eslint-config-next and eslint-plugin-import, both devDependencies).
  # Same shape as esbuild above: `postinstall.js` selects the platform-native
  # `@unrs/resolver-binding-*` package, and the resolver can't do its actual
  # job — resolving TypeScript imports during lint — without it.
  unrs-resolver: true
